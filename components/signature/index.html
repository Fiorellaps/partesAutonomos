<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; font-family: sans-serif; }
  #wrap { position: relative; border: 2px dashed #e2693a; border-radius: 8px; background: #fffdfb; }
  canvas { display: block; width: 100%; height: 160px; touch-action: none; }
  #hint { position: absolute; left: 0; right: 0; top: 60px; text-align: center; color: #bbb; pointer-events: none; font-size: 14px; }
  #bar { display: flex; justify-content: flex-end; margin-top: 6px; }
  button { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 14px; font-size: 14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">Firme aquí con el dedo</div>
</div>
<div id="bar"><button id="clear" type="button">Borrar firma</button></div>
<script>
  // Protocolo mínimo de componentes de Streamlit (sin build, sin dependencias)
  function send(type, data) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
  }
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  let drawing = false, dirty = false, last = null;

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;                               // iframe aún sin tamaño
    if (canvas.width === Math.round(w * ratio) && canvas.height === Math.round(h * ratio)) return;
    canvas.width = w * ratio;
    canvas.height = h * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#0a1f6e";
  }
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (!dirty) resize();                               // por si el lienzo se creó con ancho 0
    drawing = true; last = pos(e);
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, 6.3); ctx.fillStyle = "#0a1f6e"; ctx.fill();
    hint.style.display = "none";
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; dirty = true;
    e.preventDefault();
  });
  function end() {
    if (!drawing) return;
    drawing = false;
    // Fondo transparente: la firma se estampa limpia sobre el PDF
    send("streamlit:setComponentValue", {value: canvas.toDataURL("image/png"), dataType: "json"});
  }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);

  document.getElementById("clear").addEventListener("click", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hint.style.display = "block";
    dirty = false;
    send("streamlit:setComponentValue", {value: "", dataType: "json"});
  });

  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "streamlit:render") {
      send("streamlit:setFrameHeight", {height: 215});
    }
  });
  new ResizeObserver(() => { if (!dirty) resize(); }).observe(canvas);
  resize();
  send("streamlit:componentReady", {apiVersion: 1});
  send("streamlit:setFrameHeight", {height: 215});
</script>
</body>
</html>
